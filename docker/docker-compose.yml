services:
  jupyterlab:
    build: .
    image: elijun831/qiskit-on-docker:jupyterlab
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks:rw
      - ./data:/home/appuser/data:rw
      - .:/app:rw
      - ./trash:/app/.Trash-0:rw
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - JUPYTER_ENABLE_LAB=yes
      - NB_UID=0
      - NB_GID=0
    command: ["poetry", "run", "jupyter", "lab", "--ip=0.0.0.0", "--no-browser", "--allow-root", "--certfile=/home/appuser/ssl_cert/localhost.pem", "--keyfile=/home/appuser/ssl_cert/localhost.key", "--notebook-dir=/app/notebooks"]
    networks:
      - mynetwork
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    cap_drop:
      - all
    tmpfs:
      - /tmp

networks:
  mynetwork:
    driver: bridge
