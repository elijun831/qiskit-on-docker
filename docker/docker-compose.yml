services:
  qiskitondocker:
    build:
      context: .
      dockerfile: Dockerfile
    image: elijun831/qiskit-on-docker:1.0.0
    volumes:
      - /notebooks:/notebooks
    networks:
      - mynetwork

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - /etc/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - jupyterlab
    networks:
      - mynetwork
    environment:
      - SSL_CERT=/etc/nginx/certs/_wildcard.qiskitondocker.dev+3.pem
      - SSL_CERT_KEY=/etc/nginx/certs/_wildcard.qiskitondocker.dev+3-key.pem
      - DH_PARAM=/etc/nginx/certs/dhparam.pem
    command: /bin/bash -c "envsubst < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"

  jupyterlab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jupyterlab
    ports:
      - "8888:8888"
      - "5678:5678"
    volumes:
      - /notebooks:/notebooks
    environment:
      - JUPYTER_PASSWORD=password  # Set your desired password here
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
