services:
  jupyterlab:
    build: .
    image: elijun831/qiskit-on-docker:1.0.0
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks:rw
      - ./data:/home/appuser/data:rw
      - .:/app:rw
      - ./notebooks:/home/appuser/notebooks:rw
    user: "root"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - JUPYTER_ENABLE_LAB=yes
      - NB_UID=0
      - NB_GID=0
    command: ["poetry", "run", "jupyter", "lab", "--ip=0.0.0.0", "--no-browser", "--allow-root", "--certfile=/home/appuser/ssl_cert/localhost.pem", "--keyfile=/home/appuser/ssl_cert/localhost.key", "--notebook-dir=/app/notebooks"]
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
