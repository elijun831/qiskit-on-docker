services:
  jupyterlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: elijun831/qiskit-on-docker:jupyterlab
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks:rw
      - ./data:/home/appuser/data:rw
      - .:/app:rw
      - ./notebooks:/home/appuser/notebooks:rw
      - ./trash:/app/.Trash-0:rw
      - ./ssl:/etc/ssl:ro  # Mount the SSL certificates directory
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - JUPYTER_ENABLE_LAB=yes
      - NB_UID=0
      - NB_GID=0
      - SSL_CERTFILE=/etc/ssl/tls.crt
      - SSL_KEYFILE=/etc/ssl/tls.key
    networks:
      - mynetwork
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    cap_drop:
      - all
    tmpfs:
      - /tmp

networks:
  mynetwork:
    driver: bridge
