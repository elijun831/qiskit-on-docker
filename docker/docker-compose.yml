services:
  jupyterhub:
    build: .
    image: elijun831/qiskit-on-docker:1.0.0-jupyterjub
    ports:
      - "8000:8000"
    volumes:
      - ./notebooks:/app/notebooks:rw
      - ./data:/home/appuser/data:rw
      - .:/app:rw
      - ./notebooks:/home/appuser/notebooks:rw
    user: "root"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: ["jupyterhub", "-f", "/etc/jupyterhub/jupyterhub_config.py"]
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
