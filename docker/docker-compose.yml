services:
  web:
    build: ./
    image: elijun831/qiskit-on-docker:1.0.0
    networks:
      - mynetwork
    volumes:
      - /notebooks:/notebooks

  qiskitondocker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
      - "5678:5678"
      - "8443:443"
    volumes:
      - /notebooks:/notebooks
    networks:
      - mynetwork

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      - NGX_HTTP_PORT=80
      - NGX_HTTPS_PORT=443
      - JUPYTER_HOST=web  # Or internal IP of 'web' service 
      - JUPYTER_PORT=8888
    networks:
      - mynetwork
    depends_on:
      - qiskitondocker
    links:
      - qiskitondocker

networks:
  mynetwork:
    driver: bridge
