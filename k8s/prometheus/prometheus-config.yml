apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'jupyterlab'
        static_configs:
          - targets: ['jupyterlab:8888']
        metrics_path: '/metrics'
        scheme: 'https'
        tls_config:
          insecure_skip_verify: true
