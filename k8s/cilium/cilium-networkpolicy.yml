apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qiskit-on-docker-jupyterlab-localhost-policy
  namespace: quantum-research
  annotations:
    description: "Localhost network policy for JupyterLab with optional external services"
    author: "Quantum Research Team"
    version: "1.0"
    
spec:
  description: "Restrict JupyterLab traffic to localhost with optional external services"
  endpointSelector:
    matchLabels:
      app: jupyterlab
      environment: research
  ingress:
  - fromEndpoints:
    - matchLabels: {}
    toPorts:
    - ports:
      - port: "8888"
        protocol: TCP
      - port: "80"
        protocol: TCP
      - port: "443"
        protocol: TCP
    - ports:
      - port: "5000-5010"
        protocol: UDP
  egress:
  - toCIDR:
    - 127.0.0.1/32
    toPorts:
    - ports:
      - port: "1-65535"
        protocol: TCP
      - port: "1-65535"
        protocol: UDP

  # Optional: Database access
  - toEndpoints:
    - matchLabels:
        app: database
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
      - port: "6379"
        protocol: TCP
      - port: "27017"
        protocol: TCP

  # Optional: Monitoring service access
  - toEndpoints:
    - matchLabels:
        app: monitoring
    toPorts:
    - ports:
      - port: "9090-9100"
        protocol: TCP
  
  # Optional: Quantum simulator access
  - toEndpoints:
    - matchLabels:
        app: quantum-simulator
    toPorts:
    - ports:
      - port: "8000-8010"
        protocol: TCP
  
  # Optional: Cloud provider access
  - toFQDNs:
    - matchName: "*.quantum-cloud-provider.com" # Change it to the address of cloud providers such as AWS, Azure, GCP, etc.
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  
  # Optional: External DNS and NTP access
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "123"
        protocol: UDP
