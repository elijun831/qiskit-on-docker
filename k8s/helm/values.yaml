serviceAccounts:
  create: true
  qiskitOnDocker:
    name: "qiskit-on-docker-service-account"
    annotations: {}
    automount: true
  cilium:
    name: "cilium"
    annotations: {}
    automount: true

prometheus:
  image: prom/prometheus:latest
  nodeExporter:
    enabled: true
  cAdvisor:
    enabled: true
  service:
    type: ClusterIP
    port: 9090

grafana:
  image: grafana/grafana:latest
  adminPassword: admin
  service:
    type: ClusterIP
    port: 3000

qiskit:
  image: elijun831/qiskit-on-docker:jupyterlab
  service:
    type: ClusterIP
    port: 8888

alertmanager:
  image: prom/alertmanager:latest
  service:
    type: ClusterIP
    port: 9093

loki:
  image: grafana/loki:main
  service:
    type: ClusterIP
    port: 3100

jaeger:
  image: jaegertracing/all-in-one:latest
  service:
    type: ClusterIP
    port: 16686

trivy:
  image: aquasec/trivy:latest
  schedule: "0 0 * * *"  # Set to scan every day at midnight
  targetImage: "elijun831/qiskit-on-docker:jupyterlab"  # Target image to scan
  reportDirectory: "/reports"  # Directory to store scan reports

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - /
  tls: []

cilium:
  image: "cilium/cilium:stable"
  service:
    port: 80
  ipv4:
    enabled: true
  ipv6:
    enabled: false
  tunnel: vxlan
  clusterName: k8s-cluster
  identityAllocationMode: kvstore
  nativeRoutingCIDR: 10.0.0.0/8
  hostReachableServices: true
  directNodeRoutes: true
  kvstore:
    type: etcd
    configMap: combined-config
    etcd:
      endpoints:
        - https://etcd-server:2379
      caFile: /etc/ssl/etcd/etcd-ca.pem
      certFile: /etc/ssl/etcd/etcd-client.pem
      keyFile: /etc/ssl/etcd/etcd-client-key.pem

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
