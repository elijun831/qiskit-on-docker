configMapName: combined-config

serviceAccounts:
  create: true
  qiskitOnDocker:
    name: "qiskit-on-docker-service-account"
    annotations: {}
    automount: true
  cilium:
    name: "cilium"
    annotations: {}
    automount: true

prometheus:
  image: prom/prometheus:latest
  nodeExporter:
    enabled: true
  cAdvisor:
    enabled: true
  service:
    type: ClusterIP
    port: 9090

grafana:
  image: grafana/grafana:latest
  adminPassword: admin
  service:
    type: ClusterIP
    port: 3000

cilium:
  image: cilium/cilium:stable
  service:
    type: ClusterIP
    port: 9090

qiskit:
  image: elijun831/qiskit-on-docker:jupyterlab
  service:
    type: ClusterIP
    port: 8888

alertmanager:
  image: prom/alertmanager:latest
  service:
    type: ClusterIP
    port: 9093

loki:
  image: grafana/loki:main
  service:
    type: ClusterIP
    port: 3100

kiali:
  service:
    port: 20001
  secret:
    username: "admin"
    passphrase: "admin"
    signingKey: "some-signing-key"
  image: "kiali/kiali:latest"
  env:
    - name: KIALI_USERNAME
      valueFrom:
        secretKeyRef:
          name: kiali
          key: username
    - name: KIALI_PASSPHRASE
      valueFrom:
        secretKeyRef:
          name: kiali
          key: passphrase
    - name: KIALI_SIGNING_KEY
      valueFrom:
        secretKeyRef:
          name: kiali
          key: signingKey

jaeger:
  image: jaegertracing/all-in-one:latest
  service:
    type: ClusterIP
    port: 16686

trivy:
  image: aquasec/trivy:latest
  schedule: "0 0 * * *"  # Set to scan every day at midnight
  targetImage: "elijun831/qiskit-on-docker:jupyterlab"  # Target image to scan
  reportDirectory: "/reports"  # Directory to store scan reports

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - /
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
