serviceAccounts:
  create: true
  preflight:
    name: "cilium-preflight-sa"
    automount: true
  qiskitOnDocker:
    name: "qiskit-on-docker-service-account"
    annotations: {}
    automount: true
  cilium:
    name: "cilium"
    annotations: {}
    automount: true

etcd:
  image: "bitnami/etcd:latest"
  replicaCount: 1
  storage: 1Gi
  service:
    type: ClusterIP
    port: 2379
  resources:
    requests:
      cpu: "256m"
      memory: "512Mi"
    limits:
      cpu: "512m"
      memory: "1024Mi"
  persistentVolumeAccessMode: ReadWriteOnce
  etcdEndpoint: "https://etcd-server:2379"

prometheus:
  image: "prom/prometheus:latest"
  nodeExporter:
    enabled: true
  cAdvisor:
    enabled: true
  service:
    type: ClusterIP
    port: 9090

grafana:
  image: "grafana/grafana:latest"
  adminPassword: "admin"
  service:
    type: ClusterIP
    port: 3000

qiskit:
  image: "elijun831/qiskit-on-docker:jupyterlab"
  service:
    type: ClusterIP
    port: 8888

alertmanager:
  image: "prom/alertmanager:latest"
  service:
    type: ClusterIP
    port: 9093

loki:
  image: "grafana/loki:main"
  service:
    type: ClusterIP
    port: 3100

jaeger:
  image: "jaegertracing/all-in-one:latest"
  service:
    type: ClusterIP
    port: 16686

trivy:
  image: "aquasec/trivy:latest"
  schedule: "0 0 * * *"  # Set to scan every day at midnight
  targetImage: "elijun831/qiskit-on-docker:jupyterlab"  # Target image to scan
  reportDirectory: "/reports"  # Directory to store scan reports

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - /
  tls: []

cilium:
  image: "quay.io/cilium/cilium:stable"
  service:
    port: 80
  ipv4:
    enabled: true
  ipv6:
    enabled: false
  tunnel: "vxlan"
  clusterName: "k8s-cluster"
  identityAllocationMode: "kvstore"
  nativeRoutingCIDR: "10.0.0.0/8"
  hostReachableServices: true
  directNodeRoutes: true
  kvstore:
    type: "etcd"
    configMap: "combined-config"
    etcd:
      endpoints:
        - "https://etcd-server:2379"
      caFile: "/etc/ssl/etcd/etcd-ca.pem"
      certFile: "/etc/ssl/etcd/etcd-client.pem"
      keyFile: "/etc/ssl/etcd/etcd-client-key.pem"

preflight:
  enabled: true
  validateCNPs: true
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  image: "quay.io/cilium/cilium:v1.10.4"
  imagePullPolicy: IfNotPresent
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
  extraVolumeMounts: []
  extraEnv: []
  resources: {}
  extraVolumes: []
  priorityClassName: ""
  terminationGracePeriodSeconds: 30
  affinity: {}
  nodeSelector: {}
  tolerations: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: null

k8sServiceHost: "kubernetes.default.svc"
k8sServicePort: "443"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
