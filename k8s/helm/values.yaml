configMapName: combined-config

serviceAccount:
  create: true
  name: "qiskit-on-docker-service-account"
  annotations: {}
  automount: true

prometheus:
  image: prom/prometheus:latest
  nodeExporter:
    enabled: true
  cAdvisor:
    enabled: true
  service:
    type: ClusterIP
    port: 9090

grafana:
  image: grafana/grafana:latest
  adminPassword: admin
  service:
    type: ClusterIP
    port: 3000

cilium:
  image: cilium/cilium:stable
  service:
    type: ClusterIP
    port: 9090

qiskit:
  image: elijun831/qiskit-on-docker:jupyterlab
  service:
    type: ClusterIP
    port: 8888

alertmanager:
  image: prom/alertmanager:latest
  service:
    type: ClusterIP
    port: 9093

loki:
  image: grafana/loki:main
  service:
    type: ClusterIP
    port: 3100

kiali:
  image: kiali/kiali:latest
  service:
    type: ClusterIP
    port: 20001

jaeger:
  image: jaegertracing/all-in-one:latest
  service:
    type: ClusterIP
    port: 16686

trivy:
  image: aquasec/trivy:latest
  schedule: "0 0 * * *"  # Set to scan every day at midnight
  targetImage: "elijun831/qiskit-on-docker:jupyterlab"  # Target image to scan
  reportDirectory: "/reports"  # Directory to store scan reports

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: true

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - /
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
