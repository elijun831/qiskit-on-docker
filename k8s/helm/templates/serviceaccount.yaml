{{- if .Values.serviceAccounts.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.qiskitOnDocker.name }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    {{- toYaml .Values.serviceAccounts.qiskitOnDocker.annotations | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccounts.qiskitOnDocker.automount | default true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.cilium.name }}
  namespace: default
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    {{- toYaml .Values.serviceAccounts.cilium.annotations | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccounts.cilium.automount | default true }}
{{- end }}
