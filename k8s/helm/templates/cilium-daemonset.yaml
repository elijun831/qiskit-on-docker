apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  template:
    metadata:
      labels:
        k8s-app: cilium
    spec:
      containers:
        - name: cilium-agent
          image: quay.io/cilium/cilium:stable
          env:
            - name: CILIUM_CONF
              value: /etc/cilium/cilium.conf
          volumeMounts:
            - name: cilium-config
              mountPath: /etc/cilium/cilium.conf
              subPath: cilium.conf
            - name: etcd-certs
              mountPath: /etc/ssl/etcd
      volumes:
        - name: cilium-config
          configMap:
            name: combined-config
        - name: etcd-certs
          secret:
            secretName: etcd-certs
