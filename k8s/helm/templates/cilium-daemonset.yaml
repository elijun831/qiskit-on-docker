apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  template:
    metadata:
      labels:
        k8s-app: cilium
    spec:
      containers:
        - name: cilium-agent
          image: quay.io/cilium/cilium:stable
          command:
            - cilium-agent
            - --kvstore=etcd
            - --kvstore-opt=etcd.config=/var/lib/cilium/etcd-config.yaml
            - --enable-ipv4=true
            - --enable-ipv6=false
            - --tunnel=vxlan
            - --cluster-name=k8s-cluster
            - --identity-allocation-mode=kvstore
            - --native-routing-cidr=10.0.0.0/8
            - --enable-host-reachable-services=true
            - --auto-direct-node-routes=true
          env:
            - name: CILIUM_CONF
              value: /etc/cilium/cilium.conf
          volumeMounts:
            - name: cilium-config
              mountPath: /etc/cilium/cilium.conf
              subPath: cilium.conf
            - name: etcd-certs
              mountPath: /etc/ssl/etcd
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/ready
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 20
          livenessProbe:
            exec:
              command:
              - cat
              - /tmp/ready
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: cilium-config
          configMap:
            name: combined-config
            items:
              - key: cilium.conf
                path: cilium.conf
              - key: etcd-config.yaml
                path: etcd-config.yaml
        - name: etcd-certs
          secret:
            secretName: etcd-certs
---
{{- if and .Values.preflight.enabled .Values.preflight.validateCNPs }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilium-pre-flight-check
  namespace: {{ .Release.Namespace }}
  {{- with .Values.preflight.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/part-of: cilium
    app.kubernetes.io/name: cilium-pre-flight-check
spec:
  selector:
    matchLabels:
      k8s-app: cilium-pre-flight-check-deployment
      kubernetes.io/cluster-service: "true"
  template:
    metadata:
      {{- with .Values.preflight.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/part-of: cilium
        k8s-app: cilium-pre-flight-check-deployment
        kubernetes.io/cluster-service: "true"
        app.kubernetes.io/name: cilium-pre-flight-check
        {{- with .Values.preflight.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cnp-validator
          image: {{ .Values.preflight.image }}
          imagePullPolicy: {{ .Values.preflight.imagePullPolicy }}
          command: ["/bin/sh"]
          args:
          - -ec
          - |
            cilium-dbg preflight validate-cnp;
            touch /tmp/ready-validate-cnp;
            sleep 1h;
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/ready-validate-cnp
            initialDelaySeconds: {{ .Values.preflight.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.preflight.readinessProbe.periodSeconds }}
          volumeMounts:
          - name: cilium-config
            mountPath: /etc/cilium/cilium.conf
            subPath: cilium.conf
          - name: etcd-certs
            mountPath: /etc/ssl/etcd
          {{- with .Values.preflight.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          env:
          {{- if .Values.k8sServiceHost }}
          - name: KUBERNETES_SERVICE_HOST
            value: {{ .Values.k8sServiceHost }}
          - name: KUBERNETES_SERVICE_PORT
            value: {{ .Values.k8sServicePort }}
          {{- end }}
          {{- with .Values.preflight.extraEnv }}
          {{- toYaml . | trim | nindent 10 }}
          {{- end }}
          {{- with .Values.preflight.resources }}
          resources:
            {{- toYaml . | trim | nindent 12 }}
          {{- end }}
          terminationMessagePolicy: FallbackToLogsOnError
      volumes:
      - name: cilium-config
        configMap:
          name: combined-config
          items:
            - key: cilium.conf
              path: cilium.conf
            - key: etcd-config.yaml
              path: etcd-config.yaml
      - name: etcd-certs
        secret:
          secretName: etcd-certs
      {{- with .Values.preflight.extraVolumes }}
      {{- toYaml . | trim | nindent 6 }}
      {{- end }}
      hostNetwork: true
      restartPolicy: Always
      priorityClassName: {{ default "" .Values.preflight.priorityClassName }}
      serviceAccountName: {{ default "default" .Values.serviceAccounts.preflight.name | quote }}
      automountServiceAccountToken: {{ default true .Values.serviceAccounts.preflight.automount }}
      terminationGracePeriodSeconds: {{ .Values.preflight.terminationGracePeriodSeconds }}
      {{- with .Values.preflight.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.preflight.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.preflight.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
