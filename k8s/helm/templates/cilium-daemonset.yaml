apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  template:
    metadata:
      labels:
        k8s-app: cilium
    spec:
      serviceAccountName: cilium
      containers:
      - name: cilium
        image: "quay.io/cilium/cilium:v1.15.7"
        command:
        - cilium-agent
        args:
        - --kvstore=etcd
        - --kvstore-opt=etcd.config=/var/lib/etcd-config/etcd.config
        - --enable-ipv4=true
        - --enable-ipv6=false
        - --enable-remote-node-identity=true
        - --container-runtime=none
        - --tunnel=vxlan
        - --cluster-name=k8s-cluster
        - --identity-allocation-mode=crd
        - --native-routing-cidr=10.0.0.0/8
        - --enable-host-reachable-services=true
        - --auto-direct-node-routes=true
        volumeMounts:
        - mountPath: /var/lib/etcd-config
          name: etcd-config
      volumes:
      - name: etcd-config
        configMap:
          name: cilium-etcd-config
