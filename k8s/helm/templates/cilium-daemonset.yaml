apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: control-qiskit-monitoring-cilium
  namespace: default
spec:
  selector:
    matchLabels:
      app: control-qiskit-monitoring-cilium
  template:
    metadata:
      labels:
        app: control-qiskit-monitoring-cilium
    spec:
      containers:
      - name: cilium
        image: bitnami/cilium:latest
        args:
        - cilium-agent
        - --kvstore=etcd
        - --kvstore-opt=etcd.config=/var/lib/cilium/etcd-config.yaml
        - --enable-ipv4=true
        - --enable-ipv6=false
        - --cluster-name=k8s-cluster
        - --identity-allocation-mode=kvstore
        - --enable-host-reachable-services=true
        - --auto-direct-node-routes=true
        volumeMounts:
        - mountPath: /var/lib/cilium
          name: cilium-config
        - mountPath: /etc/ssl/etcd
          name: etcd-certs
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          capabilities:
            add: ["NET_ADMIN", "SYS_ADMIN"]
      volumes:
      - configMap:
          name: combined-config
        name: cilium-config
      - name: etcd-certs
        secret:
          secretName: etcd-certs
