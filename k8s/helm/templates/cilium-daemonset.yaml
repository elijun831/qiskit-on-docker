metadata:
  name: control-qiskit-monitoring-cilium
  namespace: kube-system
  labels:
    app: control-qiskit-monitoring-cilium
    app.kubernetes.io/managed-by: "Helm"
  annotations:
    meta.helm.sh/release-name: "control"
    meta.helm.sh/release-namespace: "default"
spec:
  selector:
    matchLabels:
      app: control-qiskit-monitoring-cilium
  template:
    metadata:
      labels:
        app: control-qiskit-monitoring-cilium
    spec:
      hostNetwork: true
      containers:
      - name: cilium
        image: cilium/cilium:stable
        args:
        - cilium-agent
        - --config=/var/lib/cilium/cilium.conf
        volumeMounts:
        - mountPath: /var/lib/cilium
          name: cilium-config
        - mountPath: /etc/ssl/etcd
          name: etcd-certs
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
      volumes:
      - configMap:
          name: combined-config
          items:
            - key: cilium.conf
              path: cilium.conf
            - key: etcd-config.yaml
              path: etcd-config.yaml
        name: cilium-config
      - name: etcd-certs
        secret:
          secretName: etcd-certs
