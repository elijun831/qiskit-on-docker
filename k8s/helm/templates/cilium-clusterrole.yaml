apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-admin
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: control
    meta.helm.sh/release-namespace: default
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]

---

apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: cilium-psp
spec:
  privileged: false
  allowPrivilegeEscalation: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'secret'
    - 'projected'
  readOnlyRootFilesystem: false
  forbiddenSysctls:
    - 'net.*'
  allowedCapabilities:
    - 'NET_ADMIN'
    - 'SYS_TIME'
  requiredDropCapabilities:
    - 'ALL'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  defaultAllowPrivilegeEscalation: false
