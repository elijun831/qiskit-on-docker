{{- if .Values.cilium.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  template:
    metadata:
      labels:
        k8s-app: cilium
    spec:
      serviceAccountName: cilium
      containers:
      - name: cilium
        image: "{{ .Values.cilium.image }}"
        command:
        - cilium-agent
        args:
        - --kvstore={{ .Values.cilium.kvstore.type }}
        - --kvstore-opt=etcd.config=/var/lib/etcd-config/etcd.config
        - --enable-ipv4={{ .Values.cilium.ipv4.enabled }}
        - --enable-ipv6={{ .Values.cilium.ipv6.enabled }}
        - --enable-remote-node-identity=true
        - --container-runtime=none
        - --tunnel={{ .Values.cilium.tunnel }}
        - --cluster-name={{ .Values.cilium.clusterName }}
        - --identity-allocation-mode={{ .Values.cilium.identityAllocationMode }}
        - --native-routing-cidr={{ .Values.cilium.nativeRoutingCIDR }}
        - --enable-host-reachable-services={{ .Values.cilium.hostReachableServices }}
        - --auto-direct-node-routes={{ .Values.cilium.directNodeRoutes }}
        volumeMounts:
        - mountPath: /var/lib/etcd-config
          name: etcd-config
      volumes:
      - name: etcd-config
        configMap:
          name: {{ .Values.cilium.kvstore.configMap }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  labels:
    {{- include "qiskit-monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  template:
    metadata:
      labels:
        app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          ports:
            - containerPort: {{ .Values.prometheus.service.port }}
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: combined-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-prometheus
spec:
  selector:
    app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
      targetPort: {{ .Values.prometheus.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-prometheus
spec:
  selector:
    app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
      targetPort: {{ .Values.prometheus.service.port }}
