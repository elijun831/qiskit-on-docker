apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  labels:
    {{- include "qiskit-monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  template:
    metadata:
      labels:
        app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          ports:
            - containerPort: {{ .Values.prometheus.service.port }}
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: {{ .Values.cilium.kvstore.configMap }}
            items:
              - key: prometheus.yml
                path: prometheus.yml
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-prometheus
spec:
  selector:
    app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
      targetPort: {{ .Values.prometheus.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-cilium
  labels:
    {{- include "qiskit-monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "qiskit-monitoring.fullname" . }}-cilium
  template:
    metadata:
      labels:
        app: {{ include "qiskit-monitoring.fullname" . }}-cilium
    spec:
      containers:
        - name: cilium
          image: {{ .Values.cilium.image }}
          command:
            - /bin/sh
            - -c
            - |
              cilium-agent \
              --kvstore=etcd \
              --kvstore-opt=etcd.config=/var/lib/cilium/etcd-config.yaml \
              --enable-ipv4=true \
              --enable-ipv6=false \
              --tunnel=vxlan \
              --cluster-name=k8s-cluster \
              --identity-allocation-mode=kvstore \
              --native-routing-cidr=10.0.0.0/8 \
              --enable-host-reachable-services=true \
              --auto-direct-node-routes=true
          ports:
            - containerPort: {{ .Values.cilium.service.port }}
          volumeMounts:
            - name: cilium-config
              mountPath: /var/lib/cilium
            - name: etcd-certs
              mountPath: /etc/ssl/etcd
      volumes:
        - name: cilium-config
          configMap:
            name: combined-config
            items:
              - key: cilium.conf
                path: cilium.conf
              - key: etcd-config.yaml
                path: etcd-config.yaml
        - name: etcd-certs
          secret:
            secretName: etcd-certs
---
