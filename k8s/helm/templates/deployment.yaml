apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-trivy-scan
  labels:
    {{- include "qiskit-monitoring.labels" . | nindent 4 }}
spec:
  schedule: "{{ .Values.trivy.schedule }}"  # Use the schedule defined in values.yaml
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: trivy
              image: "{{ .Values.trivy.image }}"  # Use the Trivy image defined in values.yaml
              args:
                [
                  "image",
                  "--format",
                  "table",
                  "--output",
                  "{{ .Values.trivy.reportDirectory }}/trivy-report.txt",  # Save the report to the specified directory
                  "{{ .Values.trivy.targetImage }}"  # Scan the target image defined in values.yaml
                ]
              volumeMounts:
                - name: report-volume
                  mountPath: "{{ .Values.trivy.reportDirectory }}"  # Mount the report directory
          restartPolicy: OnFailure
          volumes:
            - name: report-volume
              emptyDir: {} 
---
{{- if and .Values.preflight.enabled .Values.preflight.validateCNPs }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilium-pre-flight-check
  namespace: {{ .Release.Namespace }}
  {{- with .Values.preflight.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/part-of: cilium
    app.kubernetes.io/name: cilium-pre-flight-check
spec:
  selector:
    matchLabels:
      k8s-app: cilium-pre-flight-check-deployment
      kubernetes.io/cluster-service: "true"
  template:
    metadata:
      {{- with .Values.preflight.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/part-of: cilium
        k8s-app: cilium-pre-flight-check-deployment
        kubernetes.io/cluster-service: "true"
        app.kubernetes.io/name: cilium-pre-flight-check
        {{- with .Values.preflight.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cnp-validator
          image: {{ include "cilium.image" .Values.preflight.image | quote }}
          imagePullPolicy: {{ .Values.preflight.image.pullPolicy }}
          command: ["/bin/sh"]
          args:
            - -ec
            - |
              cilium-dbg preflight validate-cnp;
              touch /tmp/ready-validate-cnp;
              sleep 1h;
          readinessProbe:
            exec:
              command:
                - cat
                - /tmp/ready-validate-cnp
            initialDelaySeconds: {{ .Values.preflight.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.preflight.readinessProbe.periodSeconds }}
          volumeMounts:
            - name: cilium-config
              mountPath: /etc/cilium/cilium.conf
              subPath: cilium.conf
            - name: etcd-certs
              mountPath: /etc/ssl/etcd
            {{- with .Values.preflight.extraVolumeMounts }}
            {{- toYaml . | nindent 10 }}
            {{- end }}
          env:
            {{- if .Values.k8sServiceHost }}
            - name: KUBERNETES_SERVICE_HOST
              value: {{ include "k8sServiceHost" . }}
            - name: KUBERNETES_SERVICE_PORT
              value: {{ include "k8sServicePort" . }}
            {{- end }}
            {{- with .Values.preflight.extraEnv }}
            {{- toYaml . | trim | nindent 10 }}
            {{- end }}
          {{- with .Values.preflight.resources }}
          resources:
            {{- toYaml . | trim | nindent 12 }}
          {{- end }}
          terminationMessagePolicy: FallbackToLogsOnError
      volumes:
        - name: cilium-config
          configMap:
            name: combined-config
            items:
              - key: cilium.conf
                path: cilium.conf
              - key: etcd-config.yaml
                path: etcd-config.yaml
        - name: etcd-certs
          secret:
            secretName: etcd-certs
        {{- with .Values.preflight.extraVolumes }}
        {{- toYaml . | trim | nindent 6 }}
        {{- end }}
      hostNetwork: true
      restartPolicy: Always
      priorityClassName: {{ include "cilium.priorityClass" (list $ .Values.preflight.priorityClassName "system-cluster-critical") }}
      serviceAccountName: {{ .Values.serviceAccounts.preflight.name | quote }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.preflight.automount }}
      terminationGracePeriodSeconds: {{ .Values.preflight.terminationGracePeriodSeconds }}
      {{- with .Values.preflight.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.preflight.nodeSelector }}
      nodeSelector:
        {{- toYaml . | trim | nindent 8 }}
      {{- end }}
      {{- with .Values.preflight.tolerations }}
      tolerations:
        {{- toYaml . | trim | nindent 8 }}
      {{- end }}
{{- end }}
