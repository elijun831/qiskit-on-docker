apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-trivy-scan
spec:
  schedule: "{{ .Values.trivy.schedule }}"  # Use the schedule defined in values.yaml
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: trivy
              image: "{{ .Values.trivy.image }}"  # Use the Trivy image defined in values.yaml
              args:
                [
                  "image",
                  "--format",
                  "table",
                  "--output",
                  "{{ .Values.trivy.reportDirectory }}/trivy-report.txt",  # Save the report to the specified directory
                  "{{ .Values.trivy.targetImage }}"  # Scan the target image defined in values.yaml
                ]
              volumeMounts:
                - name: report-volume
                  mountPath: "{{ .Values.trivy.reportDirectory }}"  # Mount the report directory
          restartPolicy: OnFailure
          volumes:
            - name: report-volume
              emptyDir: {}  # Use an empty directory for report storage
