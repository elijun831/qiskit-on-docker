apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          ports:
            - containerPort: {{ .Values.prometheus.service.port }}
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
      targetPort: {{ .Values.prometheus.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cilium
  template:
    metadata:
      labels:
        app: cilium
    spec:
      containers:
        - name: cilium
          image: {{ .Values.cilium.image }}
          ports:
            - containerPort: {{ .Values.cilium.service.port }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: cilium-config
              mountPath: /etc/cilium/cilium.conf
              subPath: cilium.conf
      volumes:
        - name: cilium-config
          configMap:
            name: cilium-config
---
apiVersion: v1
kind: Service
metadata:
  name: cilium
spec:
  selector:
    app: cilium
  ports:
    - protocol: TCP
      port: {{ .Values.cilium.service.port }}
      targetPort: {{ .Values.cilium.service.port }}
---
