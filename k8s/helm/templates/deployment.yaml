apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  template:
    metadata:
      labels:
        app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          ports:
            - containerPort: {{ .Values.prometheus.service.port }}
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: combined-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-prometheus
spec:
  selector:
    app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
      targetPort: {{ .Values.prometheus.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-prometheus
spec:
  selector:
    app: {{ include "qiskit-monitoring.fullname" . }}-prometheus
  ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
      targetPort: {{ .Values.prometheus.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-cilium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "qiskit-monitoring.fullname" . }}-cilium
  template:
    metadata:
      labels:
        app: {{ include "qiskit-monitoring.fullname" . }}-cilium
  spec:
    containers:
      - name: cilium
        image: {{ .Values.cilium.image }}
        args:
          - agent
        ports:
          - containerPort: {{ .Values.cilium.service.port }}
        securityContext:
          privileged: true
        volumeMounts:
          - name: cilium-config
            mountPath: /etc/cilium/cilium.conf
            subPath: cilium.conf
    volumes:
      - name: cilium-config
        configMap:
          name: combined-config
          items:
            - key: cilium.conf
              path: cilium.conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qiskit-monitoring.fullname" . }}-cilium
spec:
  selector:
    app: {{ include "qiskit-monitoring.fullname" . }}-cilium
  ports:
    - protocol: TCP
      port: {{ .Values.cilium.service.port }}
      targetPort: {{ .Values.cilium.service.port }}
---
