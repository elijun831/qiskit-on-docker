apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: kube-system
spec:
  ports:
  - port: 2379
    name: client
  clusterIP: None
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: kube-system
spec:
  serviceName: "etcd"
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      initContainers:
      - name: init-permissions
        image: busybox:1.31
        command: ["sh", "-c", "chmod -R 700 /var/lib/etcd"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/etcd
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.4.13
        ports:
        - containerPort: 2379
          name: client
        volumeMounts:
        - name: data
          mountPath: /var/lib/etcd
        command:
        - /usr/local/bin/etcd
        args:
        - --data-dir=/var/lib/etcd
        - --name=$(POD_NAME)
        - --initial-advertise-peer-urls=http://$(POD_NAME).etcd.kube-system.svc.cluster.local:2380
        - --listen-peer-urls=http://0.0.0.0:2380
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://$(POD_NAME).etcd.kube-system.svc.cluster.local:2379
        - --initial-cluster=$(POD_NAME)=http://$(POD_NAME).etcd.kube-system.svc.cluster.local:2380
        - --initial-cluster-state=new
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
