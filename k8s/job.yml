apiVersion: batch/v1
kind: Job
metadata:
  name: qiskit-on-docker-job
spec:
  template:
    metadata:
      name: qiskit-on-docker
    spec:
      containers:
      - name: qiskit-on-docker
        image: elijun831/qiskit-on-docker:1.0.0
        command: ["jupyter", "notebook", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]
      restartPolicy: Never
