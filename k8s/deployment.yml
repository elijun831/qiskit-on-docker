apiVersion: apps/v1
kind: Deployment
metadata:
  name: qiskit-on-docker-deployment
  labels:
    app: qiskit-on-docker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qiskit-on-docker
  template:
    metadata:
      labels:
        app: qiskit-on-docker
    spec:
      containers:
      - name: qsharp
        image: elijun831/qiskit-on-docker:jupyterlab
        ports:
        - containerPort: 8888
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
