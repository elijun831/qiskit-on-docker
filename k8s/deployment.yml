apiVersion: apps/v1
kind: Deployment
metadata:
  name: qiskit-on-docker-jupyterlab-deployment
  labels:
    app: qiskit-on-docker-jupyterlab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qiskit-on-docker-jupyterlab
  template:
    metadata:
      labels:
        app: qiskit-on-docker-jupyterlab
    spec:
      containers:
        - name: qiskit-on-docker-jupyterlab
          image: elijun831/qiskit-on-docker:jupyterlab
          ports:
            - containerPort: 8888
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "0.5"
              memory: "512Mi"
          volumeMounts:
            - name: qiskit-on-docker-jupyterlab-storage
              mountPath: /app/notebooks
      volumes:
        - name: qiskit-on-docker-jupyterlab-storage
          persistentVolumeClaim:
            claimName: jupyterlab-pvc
