apiVersion: v1
kind: PersistentVolume
metadata:
  name: jupyterlab-pv
  annotations:
    description: "PersistentVolume for JupyterLab data"
    pv.kubernetes.io/provisioned-by: "kubernetes.io/nfs"
  labels:
    type: nfs
    app: jupyterlab
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    server: nfs-server.default.svc.cluster.local  # Edit the NFS server address
    path: "/exports/jupyterlab-data"  # Edit the path
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - node1  # Replace with your node name or remove if not needed
